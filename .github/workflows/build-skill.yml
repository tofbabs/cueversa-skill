name: Build skill

# Builds the uploadable .skill files so nobody has to install Python locally.
#
# - Every push and pull request: builds dist/*.skill and attaches them to the
#   workflow run as a downloadable artifact (Actions tab -> run -> Artifacts).
# - Pushing a tag like v1.2.3: also publishes a GitHub Release with the .skill
#   files attached, so the latest build is always at
#   https://github.com/<owner>/<repo>/releases/latest/download/cueversa.skill
# - Manual run (Actions -> Build skill -> Run workflow) with a tag name: builds
#   that tag and creates or refreshes its release (useful for older tags).

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish as a release (e.g. v1.0.0). Leave empty to only build."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build .skill archives
        run: python3 scripts/package.py

      - name: Check tag matches plugin version
        if: env.RELEASE_TAG != ''
        run: |
          version=$(python3 -c "import json; print(json.load(open('plugins/cueversa/.claude-plugin/plugin.json'))['version'])")
          if [ "v$version" != "$RELEASE_TAG" ]; then
            echo "::error::Tag $RELEASE_TAG does not match plugin.json version $version"
            exit 1
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: cueversa-skill
          path: dist/*.skill
          if-no-files-found: error

      - name: Publish GitHub Release
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/*.skill --clobber
          else
            gh release create "$RELEASE_TAG" dist/*.skill \
              --title "Cueversa $RELEASE_TAG" \
              --notes "Download **cueversa.skill** and upload it in claude.ai under Settings → Customize → Skills. The four \`cueversa-<skill>.skill\` files are the same skills split up, if you prefer them separately (upload one set, not both)." \
              --verify-tag
          fi
